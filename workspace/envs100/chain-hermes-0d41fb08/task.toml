version = "1.0"
multi_step_reward_strategy = "mean"

[task]
name = "repo2rlenv/chain-hermes-0d41fb08"
description = "114 sequential gateway changes from NousResearch/hermes-agent history"

[metadata]
difficulty = "hard"
category = "Software"
keywords = [
    "hermes-agent",
    "pr_chain",
    "long_horizon",
    "gateway",
]
subcategory = "Software Engineering"
tags = [
    "long-horizon",
    "repository-maintenance",
    "python",
    "regression",
    "persistent-state",
]
difficulty_explanation = "The task is a chain of 114 real production changes replayed chronologically against one persistent workspace. Each stage is graded by its own tests, and milestone stages replay all earlier stages' tests, so a change that quietly breaks earlier work is caught. The difficulty is sustained maintenance of a large live codebase over a horizon no context window holds. This is the daily work of a senior engineer on a fast-moving production repository. All content is drawn from the repository's real public history."
solution_explanation = "The reference solution replays each stage's real merged pull-request diff in order: the oracle applies the stage's patch, the step verifier runs the stage's tests, and the chain advances. This works because the chain is real first-parent history, so each stage's diff applies to the state the previous stage left."
verification_explanation = "Every stage is graded by executing that stage's own tests in a separate verifier environment built per step. The verifier restores trusted test and pytest-harness copies (purging planted conftest or config), runs the test command unprivileged, and reads the runner's CTRF report rather than printed output. A step pays only on a clean command (exit 0, no untracked failures), multiplied by the pass rate of replayed earlier-stage tests, so breaking prior work lowers the score. A carry that does not apply cleanly is an infrastructure failure, not a grade."
expert_time_estimate_hours = 80.0
author_name = "Repo2RLEnv pr_chain"

